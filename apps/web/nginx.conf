server {
    listen 80;
    root /usr/share/nginx/html;

    # Forward API calls to the api container, so the browser only talks to one address.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS/CSS files have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path (e.g. /appointments) returns index.html,
    # and React Router decides what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
